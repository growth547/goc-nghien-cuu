name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-power.mjs
      - run: node scripts/check-scales.mjs
      - run: node scripts/check-kit.mjs
      - run: node scripts/check-stats.mjs
      - run: node scripts/check-process.mjs
      - run: node scripts/check-cronbach.mjs
      - run: node scripts/check-concepts.mjs
      - run: node scripts/check-model.mjs
      - run: node scripts/check-apa.mjs
      - run: node scripts/check-method.mjs
      - run: node scripts/check-data.mjs
      - run: node scripts/check-variables.mjs
      - run: node scripts/check-ratios.mjs
      - run: node scripts/check-clean.mjs
      - run: node scripts/check-doctor.mjs
      - run: pnpm exec astro build
      - run: pnpm exec pagefind --site dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
