<div class="tool">
  <form class="panel" id="ss-form" novalidate>
    <div class="row">
      <div class="field"><label for="ss-conf">Độ tin cậy</label>
        <select id="ss-conf"><option value="1.645">90%</option><option value="1.96" selected>95%</option><option value="2.576">99%</option></select></div>
      <div class="field"><label for="ss-e">Sai số cho phép (%)</label>
        <input id="ss-e" type="number" min="1" max="20" step="0.5" value="5"></div>
    </div>
    <div class="row">
      <div class="field"><label for="ss-p">Tỷ lệ ước lượng p (%)</label>
        <input id="ss-p" type="number" min="1" max="99" value="50"><small>Không biết thì để 50%, cho cỡ mẫu lớn nhất.</small></div>
      <div class="field"><label for="ss-N">Quy mô tổng thể N</label>
        <input id="ss-N" type="number" min="0" step="1" placeholder="Để trống nếu rất lớn"><small>Ví dụ: 3.200 sinh viên của khoa.</small></div>
    </div>
    <div class="row">
      <div class="field"><label for="ss-items">Số biến quan sát (câu hỏi đo lường)</label>
        <input id="ss-items" type="number" min="1" value="25"><small>Dùng cho quy tắc EFA.</small></div>
      <div class="field"><label for="ss-iv">Số biến độc lập</label>
        <input id="ss-iv" type="number" min="1" value="5"><small>Dùng cho hồi quy bội.</small></div>
    </div>
    <div class="field"><label for="ss-drop">Dự phòng phiếu bị loại (%)</label>
      <input id="ss-drop" type="number" min="0" max="50" value="15"><small>Thường 10–20%: phiếu điền bừa, bỏ dở, sai đối tượng.</small></div>
  </form>
  <div class="panel" id="ss-out" aria-live="polite"></div>
</div>
<p style="margin-top:20px">Không chắc nên chọn công thức nào? Đọc <a href="/bai-viet/co-mau-nghien-cuu-bao-nhieu-la-du/">Cỡ mẫu nghiên cứu bao nhiêu là đủ</a>.</p>
{{CTA}}
<script>
(function(){
  const $=id=>document.getElementById(id);
  const fmt=n=>n.toLocaleString('vi-VN');
  const num=id=>{const v=parseFloat($(id).value);return Number.isFinite(v)?v:NaN};
  function render(){
    const z=num('ss-conf'), e=num('ss-e')/100, p=num('ss-p')/100, N=num('ss-N'), items=num('ss-items'), iv=num('ss-iv'), drop=num('ss-drop')/100;
    const d=x=>String(x).replace('.',',');
    const out=[]; const hasN=Number.isFinite(N)&&N>0;
    if(!(e>0&&p>0&&p<1)){ $('ss-out').innerHTML='<p class="err">Sai số và tỷ lệ p phải lớn hơn 0; p nhỏ hơn 100%.</p>'; return; }
    const n0=z*z*p*(1-p)/(e*e);
    let cochran=Math.ceil(n0), how=`n₀ = z²·p(1−p)/e² = ${d(z)}²·${d(p)}·${d((1-p).toFixed(2))}/${d(e)}² = ${d(n0.toFixed(2))}`;
    if(hasN){ const n=n0/(1+(n0-1)/N); cochran=Math.ceil(n); how+=`; hiệu chỉnh tổng thể hữu hạn: n = n₀/(1+(n₀−1)/N) = ${d(n.toFixed(2))}`; }
    out.push(['Cochran (1977)',cochran,how]);
    if(hasN){ const s=N/(1+N*e*e); out.push(['Slovin / Yamane (1967)',Math.ceil(s),`n = N/(1+N·e²) = ${fmt(N)}/(1+${fmt(N)}·${d(e)}²) = ${d(s.toFixed(2))}`]); }
    else out.push(['Slovin / Yamane (1967)',null,'Cần nhập quy mô tổng thể N.']);
    if(items>0){ out.push(['EFA, tối thiểu 5:1 (Hair và cộng sự, 2010)',Math.max(50,5*items),`5 × ${items} biến quan sát; Hair khuyên không dưới 50, tốt nhất từ 100.`]);
      out.push(['EFA, lý tưởng 10:1',10*items,`10 × ${items} biến quan sát`]); }
    if(iv>0) out.push(['Hồi quy bội (Tabachnick & Fidell, 2013)',50+8*iv,`n ≥ 50 + 8m = 50 + 8 × ${iv}`]);
    const need=Math.max(...out.map(r=>r[1]||0));
    const plan=Math.ceil(need/(1-(drop||0)));
    let html=out.map(([l,v,h])=>`<div class="result"><span class="lbl">${l}</span><span class="num">${v==null?'—':fmt(v)}</span><span class="how">${h}</span></div>`).join('');
    html+=`<div class="result"><span class="lbl">Nên thu (lấy số lớn nhất + ${Math.round((drop||0)*100)}% dự phòng)</span><span class="num">${fmt(plan)}</span><span class="how">Cỡ mẫu tối thiểu ${fmt(need)} phiếu hợp lệ.</span></div>`;
    if(items>0){ const vnd=Math.round(plan*items*0.4*1100/1000)*1000;
      html+=`<div class="result"><span class="lbl">Chi phí ước tính nếu thu trên Genius Data</span><span class="num">${fmt(vnd)} đ</span><span class="how">${fmt(plan)} phiếu × ${items} câu × 0,4 GP/câu (mức gợi ý) × 1.100 đ/GP. Chỉ trả cho phiếu được duyệt; bạn có thể đặt thấp nhất 0,15 GP/câu.</span></div>`; }
    $('ss-out').innerHTML=html;
  }
  document.getElementById('ss-form').addEventListener('input',render); render();
})();
</script>
